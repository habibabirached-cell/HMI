<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ideum trackpad (standalone test)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
      touch-action: none;
      user-select: none;
    }
    .shell { display: flex; height: 100%; }
    .sidebar {
      flex: 0 0 25%;
      max-width: 25%;
      border-right: 2px solid #333;
    }
    .back {
      width: 100%;
      height: 100%;
      border: none;
      font-size: clamp(28px, 4vw, 56px);
      font-weight: 700;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
    }
    .trackpad {
      position: relative;
      width: min(72vh, 72vw);
      aspect-ratio: 1;
      border: 3px solid #005e60;
      border-radius: 12px;
      background: #111;
      touch-action: none;
      overflow: hidden;
    }
    .finger-dot {
      position: absolute;
      left: 0;
      top: 0;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border-radius: 50%;
      background: #ff2222;
      border: 3px solid #fff;
      display: none;
      pointer-events: none;
    }
    .click-btn {
      min-width: min(72vh, 72vw);
      padding: 20px 32px;
      border: 2px solid #1a8b8d;
      border-radius: 10px;
      background: #005e60;
      color: #fff;
      font-size: clamp(22px, 3vw, 40px);
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar"><button type="button" class="back" id="backBtn">Back</button></aside>
    <main class="main">
      <div id="trackpad" class="trackpad"><div id="fingerDot" class="finger-dot"></div></div>
      <button type="button" id="clickBtn" class="click-btn">Click</button>
    </main>
  </div>
  <script>
    (function () {
      const host = new URLSearchParams(location.search).get('host') || '192.168.50.1';
      const wsUrl = 'ws://' + host + ':8767';
      let ws = null;
      let bounds = { width: 1920, height: 1080 };
      let active = false;
      let last = { x: 0, y: 0 };
      let pendingDx = 0;
      let pendingDy = 0;
      let flushTimer = null;
      const trackpad = document.getElementById('trackpad');
      const dot = document.getElementById('fingerDot');

      function paint(x, y) {
        const r = trackpad.getBoundingClientRect();
        dot.style.display = 'block';
        dot.style.transform = 'translate(' + (x - r.left) + 'px,' + (y - r.top) + 'px)';
      }

      function flush() {
        flushTimer = null;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const dx = Math.round(pendingDx);
        const dy = Math.round(pendingDy);
        pendingDx = pendingDy = 0;
        if (dx || dy) ws.send(JSON.stringify({ type: 'move', dx, dy }));
      }

      function move(clientX, clientY) {
        paint(clientX, clientY);
        const dx = clientX - last.x;
        const dy = clientY - last.y;
        last = { x: clientX, y: clientY };
        if (!dx && !dy) return;
        const r = trackpad.getBoundingClientRect();
        pendingDx += dx * bounds.width / r.width;
        pendingDy += dy * bounds.height / r.height;
        if (!flushTimer) flushTimer = setTimeout(flush, 0);
      }

      function connect() {
        ws = new WebSocket(wsUrl);
        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'hello' && msg.bounds) bounds = msg.bounds;
          } catch (_) {}
        };
        ws.onclose = () => setTimeout(connect, 3000);
      }

      trackpad.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        e.preventDefault();
        active = true;
        last = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        paint(last.x, last.y);
      }, { passive: false });
      trackpad.addEventListener('touchmove', (e) => {
        if (!active || e.touches.length !== 1) return;
        e.preventDefault();
        move(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });
      trackpad.addEventListener('touchend', () => {
        active = false;
        dot.style.display = 'none';
        flush();
      }, { passive: false });

      document.getElementById('clickBtn').onclick = () => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'click' }));
      };
      document.getElementById('backBtn').onclick = () => history.back();

      connect();
    })();
  </script>
</body>
</html>
