      <line x1="4" y1="16" x2="96" y2="16"/><line x1="4" y1="28" x2="96" y2="28"/><line x1="4" y1="40" x2="96" y2="40"/>
      <line x1="24" y1="4" x2="24" y2="52"/><line x1="48" y1="4" x2="48" y2="52"/><line x1="72" y1="4" x2="72" y2="52"/>
    </g>
